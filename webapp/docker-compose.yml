# ---------------------------------------------------------------------------
# Unified capstone webapp: one frontend, three engine services.
#
#   frontend   nginx — serves the SPA and reverse-proxies the two APIs
#   ifcweb     ifcinject engine (violation injection)      — existing code
#   bnbc-web   accepted BNBC rule checkers (compliance)    — no LLM at request time
#   bnbc-generator-web  offline agentic checker generator — LLM-backed, one job at a time
#
# Local run:    docker compose up --build          -> http://localhost:8080
# Deploy (VPS): same file; swap bind concerns:
#     - put TLS in front (caddy/nginx) or add certs here
#     - named volumes below already persist uploads across restarts
#
# The two engines are deliberately separate services (different dependency
# sets, different failure modes — one parses 342 MB IFC files, the other
# must never carry LLM SDKs) but each is internally a modular monolith.
# ---------------------------------------------------------------------------

services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"                     # the only port exposed to the host
    depends_on:
      - auth-api
      - ifcweb
      - bnbc-web
      - bnbc-generator-web
    restart: unless-stopped

  auth-api:
    build: ./auth
    environment:
      DATABASE_URL: postgresql://capstone:capstone_dev_password@postgres:5432/capstone
      COOKIE_SECURE: "false"  # local HTTP only; set true behind production TLS
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: capstone
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: capstone_dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstone -d capstone"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped

  ifcweb:
    build:
      context: "../ifc-fault-injector"
    # The OpenRouter credential stays with the injector project and is never
    # copied into the image or exposed to the browser.
    env_file:
      - ../ifc-fault-injector/.env
    volumes:
      - ifcweb_data:/app/out          # uploads, scripts and generated IFC files
      - ifcfault_llm_cache:/app/ifcfault/.llm_cache
    expose:
      - "8000"                        # reachable only inside the compose network
    restart: unless-stopped

  bnbc-web:
    build:
      context: "../BNBC-Checking-Code-Generator"
    volumes:
      - bnbcweb_data:/app/out         # uploads + reports
    expose:
      - "8000"
    restart: unless-stopped

  # This service is intentionally separate from bnbc-web. It carries LLM
  # dependencies, the rulebook and the IFC corpus, and must never be exposed
  # directly to the internet.
  bnbc-generator-web:
    build:
      context: "../BNBC-Checking-Code-Generator"
      dockerfile: Dockerfile.generator
    env_file:
      - path: ../BNBC-Checking-Code-Generator/.env
        required: false
    volumes:
      - bnbcgen_artifacts:/app/artifacts
    expose:
      - "8000"
    restart: unless-stopped

volumes:
  ifcweb_data:
  bnbcweb_data:
  postgres_data:
  ifcfault_llm_cache:
  bnbcgen_artifacts:
