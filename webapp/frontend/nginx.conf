# Unified frontend: serve the SPA, reverse-proxy the two engine APIs.
# The browser only ever talks to THIS origin — no CORS anywhere.

server {
    listen 80;

    # IFC uploads run to hundreds of MB.
    client_max_body_size 400m;

    # --- static SPA -------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # This is an actively-developed SPA with no build-time cache-busting
    # (filenames never change), so browsers must always revalidate instead
    # of silently serving a stale index.html/app.js/style.css after a
    # rebuild. A 304 still costs almost nothing on a cache hit.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Password/session endpoints. The auth service owns its HttpOnly cookie.
    location /auth/ {
        proxy_pass http://auth-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal nginx subrequest: a 2xx response means a verified session.
    location = /_auth_verify {
        internal;
        proxy_pass http://auth-api:8000/api/session/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # --- engine APIs ------------------------------------------------------
    # /ifc/api/...  ->  ifcweb    /api/...
    location /ifc/ {
        auth_request /_auth_verify;
        proxy_pass http://ifcweb:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;       # uploads of large IFC files are slow
    }

    # /bnbc/api/... ->  bnbc-web  /api/...
    location /bnbc/ {
        auth_request /_auth_verify;
        proxy_pass http://bnbc-web:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;       # a full 10-rule check can take minutes
    }

    # /generator/api/... -> bnbc-generator-web /api/...
    # The generator can run for many minutes; handlers enqueue immediately and
    # the browser polls status, but downloads may include a generated checker.
}
